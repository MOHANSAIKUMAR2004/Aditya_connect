[project]
name = "aditya-connect"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "python-multipart",
    "python-dotenv",
    "PyJWT",
    "passlib[bcrypt]",
    "bcrypt==4.0.1"
]

[project.scripts]
app = "backend.main:app"
