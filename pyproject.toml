[project]
name = "aditya-connect"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]",
    "sqlalchemy",
    "python-multipart",
    "python-dotenv",
    "PyJWT",
    "passlib[bcrypt]",
    "bcrypt==4.0.1"
]

[tool.vercel]
entrypoint = "backend.main:app"
